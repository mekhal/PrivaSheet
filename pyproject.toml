[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privasheet"
version = "0.0.1"
description = "Local template-based invoice extraction"
requires-python = ">=3.12"
dependencies = [
    "pillow>=10.1",
    "pypdfium2>=4.30",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "starlette>=0.37.2",
    "rapidocr>=3.9.2",
    "onnxruntime>=1.30.0",
    "numpy>=1.21.6",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests", "spike/tests"]

[tool.setuptools.package-data]
"privasheet.web" = ["static/**/*", "templates/**/*"]
