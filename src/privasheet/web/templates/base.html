<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} - PrivaSheet</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/vendor/bootstrap/bootstrap.min.css') }}">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg border-bottom">
      <div class="container-fluid">
        <a class="navbar-brand fw-semibold" href="/">PrivaSheet</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div id="mainNav" class="collapse navbar-collapse">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            {% set nav_items = [
              ('/', 'Templates'),
              ('/templates/new', 'New template'),
              ('/scan', 'Scan batch'),
              ('/review', 'Review'),
              ('/export', 'Export')
            ] %}
            {% for href, label in nav_items %}
              <li class="nav-item">
                <a class="nav-link{% if active == href %} active{% endif %}" href="{{ href }}"{% if active == href %} aria-current="page"{% endif %}>{{ label }}</a>
              </li>
            {% endfor %}
          </ul>
          <button id="themeToggle" class="btn btn-outline-secondary btn-sm" type="button" aria-label="Toggle dark mode">Dark mode</button>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', path='/vendor/bootstrap/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', path='/vendor/react/react.production.min.js') }}"></script>
    <script src="{{ url_for('static', path='/vendor/react/react-dom.production.min.js') }}"></script>
    <script src="{{ url_for('static', path='/vendor/htm/htm.umd.js') }}"></script>
    <script src="{{ url_for('static', path='/app/react-setup.js') }}"></script>
    <script src="{{ url_for('static', path='/app/confirm.js') }}"></script>
    <script src="{{ url_for('static', path='/app/theme.js') }}"></script>
  </body>
</html>
