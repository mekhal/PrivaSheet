{% extends "base.html" %}{% block content %}
<div class="d-flex align-items-start justify-content-between gap-3 mb-3">
  <div>
    <h1 class="h3">{{ title }}</h1>
    <p class="text-body-secondary mb-0">Validate extracted fields and evidence before export.</p>
  </div>
</div>

<div class="row g-4">
  <div class="col-xl-5">
    <div id="reviewEditorRoot"></div>
  </div>
  <div class="col-xl-7">
    <div id="boxOverlayRoot"></div>
  </div>
</div>

<script id="reviewEditorData" type="application/json">{{ review_data | tojson }}</script>
<script id="boxOverlayData" type="application/json">{{ overlay_data | tojson }}</script>
<script type="module" src="{{ url_for('static', path='/app/review-editor.js') }}"></script>
<script type="module" src="{{ url_for('static', path='/app/box-overlay.js') }}"></script>
{% endblock %}
