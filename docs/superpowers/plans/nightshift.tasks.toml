- That fixture must hold values the pipeline could actually produce, so its decimals are plain: "1284.00",
  never "1,284.00". check_extraction returns canonical values (parse_decimal strips the separators) or None
  with an issue code, so a grouped decimal cannot reach a review value. Attempt 1 put "1,284.00" in
  DEMO_REVIEW_DATA and in the node test contract, which opened both review screens in an error state that
