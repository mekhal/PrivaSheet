- parse_decimal(text: str) -> str | None: canonical plain decimal string (e.g. "1,284.00" -> "1284.00",
  "(12.50)" -> "-12.50", "$ 5" -> "5"), None when the text breaks the grammar. Follow the grammar exactly: one optional
  currency marker ($, €, £, ¥, ฿ or a 3-letter uppercase code) at start or end, balanced parentheses, max 15 integer
  digits, "," only as thousands separator ("12,34" rejected), up to 4 decimals. Keep the decimals as written.
- parse_date(text: str, fmt: str) -> str | None: ISO YYYY-MM-DD, None if it does not match the format or is not a real
  date. Tokens DD, MM, MMM (English month abbreviations, case-insensitive), YYYY, YY (2000-2099); other characters are
  literal separators. Whitespace is normalized.
- is_canonical_decimal(text) and is_canonical_date(text) for review values (spec 4.3 Review).
