Acceptance: tests match the spec example line exactly, ordering, eligibility errors, atomic write leaves no temp file.
"""

[[task]]
id = "APP-06"
title = "store: connection, schema v1 and migrations"
tier = "green"
review = "technical"
paths = ["src/privasheet/store/__init__.py", "src/privasheet/store/db.py", "src/privasheet/store/schema.py", "tests/test_store_schema.py"]
body = """
Implement the SQLite layer per spec section 4 (table list, bullets under the table, Migrations) and 5.4 (Connections).
- open_db(path) -> sqlite3.Connection: isolation_level=None, row factory, PRAGMA foreign_keys=ON, busy_timeout=5000,
  WAL; refuses (StoreError) when sqlite3.sqlite_version < 3.38 or JSON functions are unavailable.
- transaction(conn) context manager: BEGIN IMMEDIATE / COMMIT / ROLLBACK.
- MIGRATIONS list; migrate(conn) applies each pending migration and sets PRAGMA user_version in the same transaction;
  refuses a database whose user_version is newer than supported.
- Schema v1: tables templates, documents, snapshots, batches, results exactly as in the spec table, doc TEXT NOT NULL
  CHECK (json_valid(doc)), generated lookup columns (json_extract), generated FK columns with REFERENCES, indexes on
  queried lookups (results.batch_id, results.status).
- dumps(doc)/loads(text) with ensure_ascii=False, allow_nan=False.
Acceptance: tests for fresh migrate, idempotent re-run, a migration failing midway leaves the old version intact,
newer version refused, json_valid check, generated columns follow doc, foreign keys enforced.
"""

