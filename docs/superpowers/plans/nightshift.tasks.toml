Implement upload validation per spec section 7 (Upload limits table). Uses Pillow and pypdfium2 only for header and
page-count reads; never decodes full images or renders pages here; never opens URLs.
- Limits dataclass with the spec defaults (25 MB, 50 files, 10 pages, 40 megapixels, 200 DPI).
