plan = "feasibility spike — synthetic data (agreed with maintainer 2026-09-17)"

[[task]]
id = "SPK-01"
title = "Synthetic invoice generator + 5 demo invoices"
tier = "green"
review = "joint"
paths = ["spike/**"]
body = """
Build a synthetic invoice generator for the feasibility spike, and generate 5 demo invoices.
All data is fake. Never use real company names, people, addresses, tax IDs or bank details.

Environment: use /home/agent/work/.venv/bin/python (Pillow is installed; there is no network, do not install packages).
Fonts: /usr/share/fonts/truetype/dejavu/ (DejaVuSans.ttf, DejaVuSans-Bold.ttf).

Deliverables:
- spike/generator/ — a module runnable as:
  /home/agent/work/.venv/bin/python -m spike.generator --out spike/samples/demo --count 5 --seed 42
- Two different invoice layouts (e.g. "layout-a": header left, totals bottom right; "layout-b": header in a
  boxed band, customer block on the right). Each invoice has: vendor name and address, customer name and address,
  invoice number, invoice date, due date, currency, a line-item table (2-6 rows: description, qty, unit price,
  amount), subtotal, tax (7%), total.
- Arithmetic is exact: amount = qty x unit price; subtotal = sum of amounts; tax = subtotal x 0.07 rounded half-up
  to 2 decimals; total = subtotal + tax. Use decimal.Decimal.
- For each invoice write invoice-NN.png (A4 portrait at 150 DPI, white background, readable text) and
  invoice-NN.json (ground truth, one line) with this shape:
  {"layout": "layout-a", "fields": {"invoice_no": "...", "invoice_date": "YYYY-MM-DD", "due_date": "YYYY-MM-DD",
   "vendor_name": "...", "customer_name": "...", "currency": "USD", "subtotal": "1200.00", "tax": "84.00",
   "total": "1284.00"}, "tables": {"line_items": [{"description": "...", "qty": "2", "unit_price": "600.00",
   "amount": "1200.00"}]}}
  Dates on the image may use a human format (e.g. 17 Sep 2026); the JSON uses ISO dates and plain decimals.
- The 5 demo invoices use both layouts.
- Same seed produces identical JSON and identical PNG bytes.

Tests (spike/tests/): arithmetic is consistent for many seeds; JSON has exactly the keys above; same seed gives the
same output; both layouts are produced; a PNG has the expected size.

Keep the whole change under 350 changed text lines (the PNGs do not count). Commit nothing; the orchestrator commits.
"""

[[task]]
id = "SPK-02"
title = "Realistic scan and phone-photo variants of synthetic invoices"
tier = "green"
review = "joint"
paths = ["spike/**"]
depends_on = ["SPK-01"]
body = """
Real inputs are mostly scanned paper invoices and phone photos. Extend the generator from SPK-01 so synthetic
invoices look like that. All data stays fake. Pillow and the standard library only (no numpy, no network, no new
packages). Use /home/agent/work/.venv/bin/python.

1. Printed formats vary (deterministic from the seed). The ground-truth JSON keeps exactly the same shape and
   canonical values as SPK-01 (ISO dates, plain decimals).
   - Dates: one of "2026-11-14", "14 Nov 2026", "Nov 14, 2026", "14/11/2026".
   - Money: one of "1285.58", "1,285.58", "$1,285.58".
2. Degradation styles, chosen with a new CLI option --style clean|scan|photo|mixed (default mixed):
   - scan: grayscale, small rotation (up to +/-1.5 degrees), light speckle noise, slight blur, uneven brightness,
     JPEG-like compression artifacts, faint border shadow.
   - photo: paper placed on a darker background, perspective distortion (as if photographed at an angle),
     rotation up to +/-5 degrees, a soft shadow or lighting gradient across the page, lower resolution, slight blur.
   Text must stay readable by a human.
3. Generate a new demo set and keep the SPK-01 clean demo unchanged:
   /home/agent/work/.venv/bin/python -m spike.generator --out spike/samples/demo-realistic --count 5 --seed 7 --style mixed
   The 5 invoices must include at least 2 scan and 2 photo, using both layouts.
4. Same seed and style produce identical PNG bytes and JSON.

Tests (spike/tests/): each style produces an image that differs from the clean render; determinism per style;
printed formats vary across seeds while JSON stays canonical; mixed produces both scan and photo; existing SPK-01
tests still pass unchanged.

Keep the change under 350 changed text lines (PNGs do not count). Commit nothing; the orchestrator commits.
"""

# ---------------------------------------------------------------------------
# Work set A — application foundation (spike-independent). Agreed with maintainer 2026-09-17.
# Spec: docs/superpowers/specs/2026-09-16-template-extraction-design.md (read the sections named in each task).
# Common rules: Python 3.12, package src/privasheet, tests in tests/, run with /home/agent/work/.venv/bin/python -m pytest.
# Installed: pillow, pypdfium2, pytest, ruff. No network, no new dependencies. Pure standard library unless stated.
# ---------------------------------------------------------------------------

[[task]]
id = "APP-01"
title = "templates: template model validation"
tier = "green"
review = "technical"
paths = ["src/privasheet/templates.py", "tests/test_templates.py"]
body = """
Implement src/privasheet/templates.py per spec section 4.1 (Template JSON and its Rules).
- validate_template(doc: dict) -> list[str]: returns human-readable errors (empty list = valid). Check every rule in
  4.1: key regex, unique keys (fields and tables share one namespace; columns unique per table), types, date format
  required and built only from tokens DD, MM, MMM, YYYY, YY plus separators, region values, at least one key_label,
  reserved arithmetic keys must be decimal, at most one table, columns default required=true, rules.tolerance is a
  decimal string, match.min_key_label_ratio in (0, 1].
- class TemplateError(ValueError) and ensure_valid(doc) raising it with all errors.
- Helpers used later: field_keys(doc), table(doc, key), key_labels(doc).
Acceptance: tests cover the spec example as valid and one failing case per rule.
"""

[[task]]
id = "APP-02"
title = "validate: decimal and date parsing"
tier = "green"
review = "technical"
paths = ["src/privasheet/validate/__init__.py", "src/privasheet/validate/parse.py", "tests/test_validate_parse.py"]
body = """
Implement src/privasheet/validate/parse.py per spec section 6 ("Decimal grammar") and 4.1 (date format tokens).
- parse_decimal(text: str) -> str | None: canonical plain decimal string (e.g. "1,284.00" -> "1284.00",
  "(12.50)" -> "-12.50", "$ 5" -> "5"), None when the text breaks the grammar. Follow the grammar exactly: one optional
  currency marker ($, €, £, ¥, ฿ or a 3-letter uppercase code) at start or end, balanced parentheses, max 15 integer
  digits, "," only as thousands separator ("12,34" rejected), up to 4 decimals. Keep the decimals as written.
- parse_date(text: str, fmt: str) -> str | None: ISO YYYY-MM-DD, None if it does not match the format or is not a real
  date. Tokens DD, MM, MMM (English month abbreviations, case-insensitive), YYYY, YY (2000-2099); other characters are
  literal separators. Whitespace is normalized.
- is_canonical_decimal(text) and is_canonical_date(text) for review values (spec 4.3 Review).
Use decimal.Decimal where arithmetic is needed; no floats. Acceptance: table-driven tests for valid and invalid inputs.
"""

[[task]]
id = "APP-03"
title = "validate: field, table and evidence checks"
tier = "green"
review = "technical"
paths = ["src/privasheet/validate/checks.py", "tests/test_validate_checks.py"]
depends_on = ["APP-01", "APP-02"]
body = """
Implement src/privasheet/validate/checks.py per spec section 6 (all checks except the arithmetic ones) and 4.3.
Pure functions, no I/O.
- Issue = dataclass(code, target, detail); target like "total" or "line_items[2].qty".
- check_extraction(template, snapshot, extracted) -> (values, issues): builds canonical values from extracted raw
  text using template types and the parse functions (PARSE_ERROR), and runs TEMPLATE_MISMATCH (difflib ratio >= 0.8
  or containment, lower-cased and whitespace-normalized, against match.min_key_label_ratio), REQUIRED_MISSING (fields,
  required tables with no rows, required columns in rows), UNGROUNDED_VALUE (raw is None but not missing),
  DUPLICATE_BOX (same box id and same span used by two different fields or cells), LOW_OCR_SCORE (< 0.80).
- check_review(template, review) -> issues: validates canonical review values (null means missing) and runs only the
  checks that do not need OCR evidence.
Use the JSON shapes from spec 4.2 and 4.3 in test fixtures. Arithmetic checks come in APP-04.
"""

[[task]]
id = "APP-04"
title = "validate: arithmetic reconciliation"
tier = "green"
review = "technical"
paths = ["src/privasheet/validate/arithmetic.py", "src/privasheet/validate/checks.py", "tests/test_validate_arithmetic.py"]
depends_on = ["APP-03"]
body = """
Implement src/privasheet/validate/arithmetic.py per spec section 6 "Arithmetic" and wire it into check_extraction and
check_review from APP-03.
- LINE_AMOUNT_MISMATCH, SUBTOTAL_MISMATCH, TOTAL_MISMATCH, RECONCILIATION_UNAVAILABLE with exactly the applicability
  rules in the spec (which columns/fields must exist, required operands, discount/shipping/tax count as 0 only when not
