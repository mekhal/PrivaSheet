Implement src/privasheet/export.py per spec section 4.5 (and 4.3 for where values come from).
- class ExportNotAllowed(ValueError).
- build_jsonl(manifest: dict, results: dict[result_id, dict], template: dict) -> str: raises ExportNotAllowed when any
