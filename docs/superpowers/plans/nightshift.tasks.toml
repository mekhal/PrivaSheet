- detail strings show the numbers, e.g. "subtotal 1200.00 + tax 84.00 = 1284.00, total 1248.00".
Acceptance: tests for each rule, tolerance boundaries (exactly 0.01 passes, 0.0100001 fails), negatives in
parentheses, and the same results through check_review.
"""

